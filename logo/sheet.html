<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;800&display=swap">
<style>body{margin:0;background:#EDF1F5;font-family:Onest,system-ui,sans-serif;color:#16233B}
.g{display:grid;grid-template-columns:repeat(3,360px);gap:24px;padding:32px}
.c{background:#fff;border-radius:20px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:20px}
.c.d{background:#0F1624;color:#E8EDF6}
.ic{width:150px;height:150px}
.wm{display:flex;align-items:center;gap:12px;font-weight:800;font-size:30px;letter-spacing:-.02em}
.wm img,.wm .mini{width:44px;height:44px}
.wm span{font-weight:500;opacity:.6}
.n{font-size:15px;font-weight:500;opacity:.7}
.mono{width:150px;height:150px;border-radius:33px;background:#16233B;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:56px;letter-spacing:-.03em}
.mono i{display:inline-block;width:16px;height:16px;border-radius:50%;background:#F5B301;margin-left:3px;align-self:flex-end;margin-bottom:52px}
.mono.s{width:44px;height:44px;border-radius:10px;font-size:17px}.mono.s i{width:5px;height:5px;margin-bottom:15px;margin-left:1px}
</style></head><body><div class="g">
<div class="c"><div class="n">1 · «Фокус»</div><img class="ic" src="v1.svg"><div class="wm"><img src="v1.svg">ADN <span>Planner</span></div></div>
<div class="c"><div class="n">2 · «adn.»</div><div class="mono">adn<i></i></div><div class="wm"><div class="mono s">adn<i></i></div>ADN <span>Planner</span></div></div>
<div class="c"><div class="n">3 · «День»</div><img class="ic" src="v3.svg"><div class="wm"><img src="v3.svg">ADN <span>Planner</span></div></div>
<div class="c d"><img class="ic" src="v1.svg"><div class="wm"><img src="v1.svg">ADN <span>Planner</span></div></div>
<div class="c d"><div class="mono">adn<i></i></div><div class="wm"><div class="mono s">adn<i></i></div>ADN <span>Planner</span></div></div>
<div class="c d"><img class="ic" src="v3.svg"><div class="wm"><img src="v3.svg">ADN <span>Planner</span></div></div>
</div></body></html>
