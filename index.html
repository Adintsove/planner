<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner A1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#EDF1F5;--surface:#fff;--ink:#16233B;--muted:#5D6B82;--line:#D5DCE6;--btn:#16233B;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1624;--surface:#18223A;--ink:#E8EDF6;--muted:#9AA7BD;--line:#2A3752;--btn:#E8EDF6;--btnink:#0F1624}}
:root[data-theme="dark"]{--bg:#0F1624;--surface:#18223A;--ink:#E8EDF6;--muted:#9AA7BD;--line:#2A3752;--btn:#E8EDF6;--btnink:#0F1624}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 12px 48px}
h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.02em}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
h2{font-size:18px;font-weight:700;margin:0}
.tabs,.seg{display:flex;gap:6px}
.tabs{margin-bottom:16px}
.tabs button,.seg button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px Onest,system-ui,sans-serif;padding:0 4px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #2E86AB;outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav{justify-content:space-between;margin-bottom:10px;flex-wrap:nowrap}
.nav .date{font-weight:700;font-size:17px;text-align:center;flex:1}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px}
input[type=text]{flex:1;min-width:140px}
input[type=checkbox]{min-height:0;width:22px;height:22px;accent-color:#2E86AB}
input[type=color]{width:44px;padding:2px;cursor:pointer}
.btn{min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--btn);color:var(--btnink);font:700 15px Onest,system-ui,sans-serif;cursor:pointer}
.ghost{min-height:44px;min-width:44px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;cursor:pointer;font:500 16px Onest,system-ui,sans-serif;padding:0 10px}
.lbl{font-size:13px;color:var(--muted)}
.gear{font-size:24px;line-height:1;padding:0}
.gf{align-items:flex-end}
.gw{border-top:1px solid var(--line)}
.gw:first-child{border-top:0}
.sub{margin:0 0 10px 32px}
.srow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.srow.done .t{text-decoration:line-through;color:var(--muted)}
.srow .t{flex:1;min-width:0;overflow-wrap:anywhere}
.sx{min-height:36px;min-width:36px}
.sub input.stt{flex:1;min-width:0;min-height:40px}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.nw{position:absolute;z-index:4;background:rgba(46,134,171,.35);border:2px solid #2E86AB;border-radius:8px;font-size:12px;font-weight:700;padding:2px 6px;pointer-events:none;color:var(--ink);overflow:hidden}
.dpick{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;overflow:hidden}
.dpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;min-height:0;border:0}
.dpick input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.dpick .dv{font-size:14px}
.rdays{flex-basis:100%}
.nt{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.nt[hidden]{display:none}
.nt .seg button{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:14px}
.ic{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer;padding:0}
.ic[aria-pressed="true"]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.cl{width:40px;height:40px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cl span{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:block}
.cl[aria-pressed="true"] span{outline:2px solid var(--ink);outline-offset:2px}
.npage{position:relative;border:1px solid var(--line);border-radius:12px;background-color:var(--bg);background-image:linear-gradient(to right,rgba(110,130,160,.07) 1px,transparent 1px),linear-gradient(to bottom,rgba(110,130,160,.07) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px;overflow:hidden;min-height:300px}
.nmore{width:100%;margin-top:6px;min-height:40px;font-size:14px;color:var(--muted)}
.nmore:disabled{opacity:.4;cursor:default}
.ned{min-height:300px;padding:0 12px;outline:none;line-height:24px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.ned:empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.nimgs{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:1}
.ncv{z-index:2}
.nimg{position:absolute;pointer-events:auto;cursor:grab;user-select:none;-webkit-user-select:none;outline:none}
.nimg img{display:block;width:100%;height:auto;border-radius:6px;pointer-events:none;-webkit-user-drag:none}
.nimg.sel{outline:2px solid #2E86AB;touch-action:none}
.nimg:focus-visible{outline:2px solid #2E86AB}
.nimg .imgx,.nimg .rh{display:none}
.nimg.sel .imgx,.nimg.sel .rh{display:block}
.nimg .imgx{right:auto;left:50%;transform:translateX(-50%)}
.rh{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #2E86AB;z-index:2}
.rh::after{content:"";position:absolute;inset:-12px}
.rh.nw{left:-10px;top:-10px;cursor:nwse-resize}.rh.ne{right:-10px;top:-10px;cursor:nesw-resize}.rh.sw{left:-10px;bottom:-10px;cursor:nesw-resize}.rh.se{right:-10px;bottom:-10px;cursor:nwse-resize}
.imgw{position:relative;display:block;width:fit-content;min-width:56px;max-width:100%;margin:6px 0}
.imgx{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:20px;line-height:1;cursor:pointer;padding:0}
.ncv{position:absolute;left:0;top:0;width:100%;pointer-events:none;touch-action:none}
.ncv.on{pointer-events:auto;cursor:crosshair;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.npage.dm,.npage.dm *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#npo[aria-pressed=true]{background:var(--btn);color:var(--btnink)}
#npo{font-size:20px}
.blkchk{position:absolute;z-index:2;width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;color:transparent;display:flex;align-items:center;justify-content:center;font-size:8px;line-height:1;font-weight:800;cursor:pointer;background:rgba(0,0,0,.15)}
.blkchk::after{content:'';position:absolute;inset:-8px}
.blkchk.on{background:#fff;color:#16233B}
.blkchk:focus-visible{outline:2px solid #2E86AB;outline-offset:2px}
.blk{padding-right:20px}
.hab{padding-left:12px}
.hab .hab{padding-left:0}
.gb{background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.gr.main{border-top:0;padding:0}
.gr.main .gh{font-size:15px;align-items:baseline}
.gt{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.gr.main .bar{height:12px}
.subs{margin-top:12px;padding-left:12px;border-left:2px dashed var(--line);font-size:13px;color:var(--muted)}
.subs>.gh{text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.subs .bar{height:6px}
.subs .hab{padding-left:0}
.subs .gr{border-top:0;padding:6px 0}
.subs .gr .gh{font-size:13px}
.subs .segs i{height:8px}
.subs .srow2{font-size:13px}
.gtop{display:flex;gap:10px;align-items:flex-start}
.gtop>input[type=checkbox]{margin-top:3px;flex:none}
.gcon{flex:1;min-width:0;cursor:pointer}
.gcon .bar{height:12px}
.gb.done .gt{text-decoration:line-through;color:var(--muted)}
.subs .srow{padding:4px 0}
.srow2{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.srow2.done .t{text-decoration:line-through;color:var(--muted)}
.srow2 .t{min-width:0;overflow-wrap:anywhere}
.segs{display:flex;gap:2px;margin:6px 0}
.segs i{flex:1;height:12px;border-radius:3px;background:var(--line);min-width:1px}
.segs.dense{gap:1px}
.segs.dense i{border-radius:1px}
.segs i.m{background:#D64545;opacity:.45}
.segs i.t{outline:2px solid var(--ink);outline-offset:1px}
.rdays[hidden]{display:none}
:root[data-pal="light"]{--bg:#EDF1F5;--surface:#fff;--ink:#16233B;--muted:#5D6B82;--line:#D5DCE6;--btn:#16233B;--btnink:#fff;color-scheme:light}
:root[data-pal="dark"]{--bg:#0F1624;--surface:#18223A;--ink:#E8EDF6;--muted:#9AA7BD;--line:#2A3752;--btn:#E8EDF6;--btnink:#0F1624;color-scheme:dark}
:root[data-pal="bright"]{--bg:#F4F1FF;--surface:#fff;--ink:#1B1340;--muted:#6B5FA8;--line:#DDD6FF;--btn:#6C3CF0;--btnink:#fff;color-scheme:light}
.sw{display:inline-flex;gap:3px;padding:3px;border-radius:8px;margin-right:6px;vertical-align:middle;border:1px solid rgba(128,128,128,.45)}
.sw i{display:block;width:10px;height:14px;border-radius:4px}
.gear[aria-pressed="true"]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.field{display:flex;flex-direction:column;gap:2px}
summary{cursor:pointer;font-weight:700;min-height:32px}
.prog{color:var(--muted);font-size:14px;margin:0 0 8px}
#cal{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.wh{display:grid;grid-template-columns:repeat(7,1fr);margin-left:44px;margin-bottom:4px}
.wh button{border:0;background:transparent;color:var(--ink);font:500 12px Onest,system-ui,sans-serif;padding:4px 0;cursor:pointer;min-height:44px}
.wh button.td{font-weight:800;color:#E4572E}
.tl{position:relative}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1}
.hr span{position:absolute;top:3px;left:0}
.mk{position:absolute;left:44px;right:0;border-top:2px dashed var(--muted);font-size:11px;color:var(--muted);z-index:2;pointer-events:none}
.mk span{position:absolute;right:0;top:2px;background:var(--surface);padding-left:6px}
.now{position:absolute;left:40px;right:0;border-top:2px solid #E4572E;z-index:3;pointer-events:none}
.vl{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.zn{position:absolute;z-index:0;pointer-events:none;font-size:11px;line-height:1.2;font-weight:700;color:var(--ink);padding:2px 4px;overflow:hidden}
.dchip{position:relative}
.dchip input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.dchip span{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.dchip input:checked+span{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.dchip input:focus-visible+span{outline:2px solid #2E86AB;outline-offset:2px}
.blk{position:absolute;border:0;border-radius:8px;padding:4px 6px;text-align:left;color:#fff;font:500 12px/1.25 Onest,system-ui,sans-serif;cursor:grab;overflow:hidden;z-index:1;touch-action:none;user-select:none;-webkit-user-select:none}
.blk b{display:block;font-weight:700}
.blk.sm{font-size:11px;padding:1px 2px;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;line-height:1.15}
.blk.sm b{width:100%;overflow-wrap:normal;text-align:left}
.blk.sm.brk b{overflow-wrap:anywhere;word-break:break-word}
.blk.done{opacity:.45;text-decoration:line-through}
.blk.drag{cursor:grabbing;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.sph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sph .cnt{margin-left:auto;color:var(--muted);font-size:14px}
.sph input.sn{flex:1;min-width:0;font:700 18px Onest,system-ui,sans-serif;background:transparent;border-color:transparent}
.sph input.sn:hover,.sph input.sn:focus{border-color:var(--line)}
.empty{color:var(--muted);padding:6px 0}
.sum{display:flex;gap:14px;align-items:center}
.gr{padding:10px 0;border-top:1px solid var(--line)}
.gh{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;border-radius:6px}
.jar{position:relative;max-width:720px;margin:0 auto}
@media (max-width:740px){.jar{width:calc(100% + 16px);max-width:none;margin-left:-8px;margin-right:-8px}}
.jar canvas{display:block;width:100%;touch-action:none;cursor:grab}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:720px;margin:0 auto}
.bd{background:transparent;font-family:inherit;padding:0;cursor:pointer;min-height:58px;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.bd b{font-size:17px;color:var(--ink)}
.bd.td span{color:#E4572E;font-weight:800}
.bd.over{border-color:var(--btn);background:var(--surface);transform:scale(1.08)}
.ghost-ball{position:fixed;z-index:50;pointer-events:none;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font:700 13px Onest,system-ui,sans-serif;box-shadow:0 8px 20px rgba(0,0,0,.35);transform:translate(-50%,-50%)}
input[type=range]{min-height:0;padding:0;width:100%;accent-color:#2E86AB}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mg .wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.mc{min-height:84px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:3px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;font:500 12px Onest,system-ui,sans-serif}
.mc.oth{opacity:.45}
.mc.td .n{background:#E4572E;color:#fff}
.mc .n{align-self:flex-start;min-width:22px;text-align:center;border-radius:11px;padding:0 4px;font-weight:700}
.chip{display:block;color:#fff;border-radius:4px;padding:0 4px;font-size:11px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--muted)}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(92vw,420px)}
dialog form{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:no-preference){.blk{transition:opacity .15s}}

.sqstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.sqgb{flex:0 0 auto;min-width:140px;max-width:200px;min-height:56px;text-align:left;border:1px solid var(--line);border-left:6px solid var(--muted);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;font:500 14px Onest,system-ui,sans-serif;display:flex;flex-direction:column;gap:2px}
.sqgb b{font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sqgb.sel{outline:2px solid var(--ink);outline-offset:1px;background:var(--surface)}
.sqgb.dn{opacity:.55}
.sqgb.sqnew{border-style:dashed;border-left-width:1px;align-items:center;justify-content:center;color:var(--muted)}
.sqtools{display:flex;gap:8px}
.sqtool{flex:1;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;cursor:pointer;font:600 14px Onest,system-ui,sans-serif}
.sqtool[aria-pressed="true"]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.sqic{font-size:24px;line-height:1;display:inline-flex}
.sqpanel:empty{display:none}
.sqp{margin:0}
.sqp h2{font-size:17px;margin:0 0 6px}
.sqrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.sqrow .sqts{flex:1;min-width:0}
.sqsc{margin-bottom:10px;max-width:320px}
.sqw{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:10px;background:var(--bg);position:relative}
.sqgr{padding:8px 0 0}
.sqgc{position:sticky;left:8px;display:flex;flex-direction:column;gap:2px;width:min(300px,calc(100vw - 80px));margin-left:8px;border:1px solid var(--line);border-left:8px solid var(--muted);background:var(--surface);border-radius:12px;padding:8px 40px 8px 12px;z-index:5}
.sqgc.dft{border-style:dashed;border-left-style:solid}
.sqgc b{font-size:16px}
.sqat{font-size:13px}
.sqbadge{align-self:flex-start;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sqxb{position:absolute;top:2px;right:2px;min-height:36px;min-width:36px}
.sqi{position:relative;margin-top:-4px}
.sqh,.sqh2{position:absolute;left:0;right:0;height:22px}
.sqh{top:0}.sqh2{top:22px}
.sqm{position:absolute;top:2px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--ink);z-index:2}
.sqd{position:absolute;top:2px;font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;padding-left:2px}
.sqd.we{color:#D9482B}.sqd.td{color:var(--ink);font-weight:800}
.sqg{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--line);opacity:.6}
.sqg.m{border-left:2px solid var(--line);opacity:1}
.sqfl{position:absolute;top:46px;bottom:0;width:0;border-left:2px dashed #2E9A62;z-index:1}
.sqfl span{position:absolute;top:0;left:3px;font-size:11px;font-weight:700;white-space:nowrap;background:#2E9A62;color:#fff;border-radius:6px;padding:1px 6px}
.sqfl.b{border-left-color:#D9482B}
.sqfl.b span{background:#D9482B;left:auto;right:3px}
.sqc{position:absolute;z-index:3;width:150px;height:56px;box-sizing:border-box;border:2px solid var(--muted);border-radius:10px;background:var(--surface);padding:3px 8px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;justify-content:center;overflow:hidden;font-size:12px;line-height:1.2}
.sqc .sqx{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sqc .sd{font-size:11px}
.sqc.mv{cursor:grabbing;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.sqc.dn{opacity:.55}.sqc.dn .sqx{text-decoration:line-through}
.sqc.nb{border-style:dashed}
.sqc.dft{border-style:dashed;background:var(--bg)}
.sqc.nd{cursor:default}
.sqbar{position:absolute;z-index:2;height:4px;border-radius:2px;opacity:.7}
.sqem{position:absolute;top:84px;left:12px;margin:0;z-index:4}

.qd{margin:2px 8px 12px;text-align:center;font-size:13px;line-height:1.4;color:var(--muted);font-style:italic}.qd .qa{font-style:normal;white-space:nowrap}
.effd{display:flex;align-items:center;gap:8px;text-align:right}.effd .lbl{font-size:11px;max-width:70px;line-height:1.2}
.mc{position:relative}.mc .ef{position:absolute;top:2px;right:2px}
.wh button .ef{display:block;margin:0 auto}
.wp{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 10px;position:relative;height:44px;box-sizing:border-box;user-select:none;-webkit-user-select:none}
.wp::before{content:'';position:absolute;left:6px;right:6px;top:11px;height:22px;border-radius:6px;background:var(--line);opacity:.6;pointer-events:none}
.wc{height:42px;box-sizing:border-box;padding:10px 0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;width:36px;text-align:center;position:relative;z-index:1;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}
.wc::-webkit-scrollbar{display:none}
.wc{cursor:grab;touch-action:pan-y}.wc div{height:22px;line-height:22px;scroll-snap-align:center;font-size:15px;font-weight:600;cursor:pointer}
.wu.wsep{font-size:16px;font-weight:700;color:var(--ink);margin:0 2px}.wu{font-size:13px;color:var(--muted);margin:0 6px 0 2px;z-index:1}
.wc:focus-visible{outline:2px solid #2E86AB;outline-offset:-2px;border-radius:8px}
.synl{margin:12px 16px 24px;text-align:center;font-size:12px;color:var(--muted)}
.mic{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:50%;border:0;background:var(--btn);color:var(--btnink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.mic[hidden]{display:none}
.mic.rec{background:#D9482B;color:#fff;animation:micp 1.1s infinite}
@keyframes micp{0%{box-shadow:0 0 0 0 rgba(217,72,43,.55)}100%{box-shadow:0 0 0 18px rgba(217,72,43,0)}}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}
.vt{position:fixed;left:16px;right:88px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;max-width:360px;margin-left:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.vt[hidden]{display:none}
.gev{position:absolute;z-index:0;box-sizing:border-box;border-left:3px solid var(--muted);background:var(--line);color:var(--muted);opacity:.75;border-radius:6px;padding:1px 4px;overflow:hidden;font:500 11px/1.2 Onest,system-ui,sans-serif;pointer-events:none}
.gev b{display:block;font-weight:600}
.gad{display:grid;gap:2px;margin:0 0 4px 44px}
.gad span{display:block;font-size:10.5px;background:var(--line);color:var(--muted);border-radius:5px;padding:1px 4px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.g{background:var(--line)!important;color:var(--muted)!important}
.gcb{min-height:36px;min-width:36px;padding:0 8px;margin-right:auto;margin-left:8px;font-size:18px}
.gcb.spin{animation:gsp 1s linear infinite}.gcb.bad{border-color:#E4572E;color:#E4572E}
@keyframes gsp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
<div class="top"><h1>Planner A1</h1><button class="ghost gear" data-act="tab" data-tab="set" aria-label="Настройки" aria-pressed="false">⚙︎</button></div>
<div class="tabs" role="tablist">
  <button role="tab" data-act="tab" data-tab="day">Ежедневник</button>
  <button role="tab" data-act="tab" data-tab="bag">Мешок задач</button>
  <button role="tab" data-act="tab" data-tab="goals">Цели по сферам</button>
  <button role="tab" data-act="tab" data-tab="strat" hidden style="display:none">Стратегия</button>
  <button role="tab" data-act="tab" data-tab="res">Результаты</button>
</div>
<div id="view"></div>
<button type="button" class="mic" id="mic" aria-label="Голосовая задача" title="Голосовая задача" hidden><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg></button>
<div class="vt" id="vt" role="status" hidden></div>
<p class="synl" id="syn" role="status">Без синхронизации: данные только на этом устройстве</p>
</main>
<dialog id="dlg"><form id="ef">
  <h2>Задача</h2>
  <input type="text" id="et" required maxlength="120" aria-label="Название">
  <select id="es" aria-label="Сфера"></select>
  <div class="row">
    <label class="field"><span class="lbl">Начало</span><input type="time" id="est" required></label>
    <label class="field"><span class="lbl">Длительность, мин</span><input type="number" id="ed" min="5" max="720" step="5" style="width:110px" required></label>
    <label class="field"><span class="lbl">Дата</span><input type="date" id="edate"></label>
  </div>
  <label class="row"><input type="checkbox" id="er"> Повторять</label>
  <div class="row rdays" id="erd" hidden><label class="dchip"><input type="checkbox" value="0" checked><span>Пн</span></label><label class="dchip"><input type="checkbox" value="1" checked><span>Вт</span></label><label class="dchip"><input type="checkbox" value="2" checked><span>Ср</span></label><label class="dchip"><input type="checkbox" value="3" checked><span>Чт</span></label><label class="dchip"><input type="checkbox" value="4" checked><span>Пт</span></label><label class="dchip"><input type="checkbox" value="5" checked><span>Сб</span></label><label class="dchip"><input type="checkbox" value="6" checked><span>Вс</span></label><div class="field" style="flex-basis:100%"><span class="lbl">Повторять до</span><label class="dpick" title="Выбрать срок"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="dv"></span><input type="date" class="dpk" id="euntil"></label></div></div>
  <label class="row"><input type="checkbox" id="edone"> Выполнено</label>
  <div class="row"><button class="btn" type="submit">Сохранить</button><button class="ghost" type="button" data-act="ecancel">Отмена</button><button class="ghost" type="button" data-act="edel" style="margin-left:auto">Удалить</button></div>
</form></dialog>
<dialog id="tdlg"><form id="tf2">
  <h2>Когда выполнить?</h2><p class="lbl" id="tdd"></p>
  <div class="row"><label class="field"><span class="lbl">Время начала</span><input type="time" id="tdst" required></label><label class="field"><span class="lbl">Длительность, мин</span><input type="number" id="tddur" min="5" max="720" step="5" style="width:110px" required></label></div>
  <div class="row"><button class="btn" type="submit">Запланировать</button><button class="ghost" type="button" data-act="tcancel">Отмена</button></div>
</form></dialog>
<dialog id="bdlg"><form id="bef">
  <h2>Задача в мешке</h2>
  <input type="text" id="bet" required maxlength="120" aria-label="Название">
  <select id="bes" aria-label="Сфера"></select>
  <label class="field"><span class="lbl">Важность (1–5)</span><input type="range" id="bei" min="1" max="5"></label>
  <div class="field"><span class="lbl">Срок</span><label class="dpick" title="Срок"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="dv"></span><input type="date" class="dpk" id="bedue"></label></div>
  <label class="row"><input type="checkbox" id="bef2"> Супер-фокус</label><p class="lbl" id="bemsg"></p>
  <div class="row"><button class="btn" type="submit">Сохранить</button><button class="ghost" type="button" data-act="bcancel">Отмена</button></div>
  <div class="row"><button class="ghost" type="button" id="bun" data-act="bunsched">Вернуть в мешок</button><button class="ghost" type="button" data-act="bdel" style="margin-left:auto">Удалить</button></div>
</form></dialog>
<dialog id="pdlg"><form id="pf">
  <h2>Запланировать подзадачу</h2><p class="lbl" id="pdt"></p>
  <div class="row"><label class="field"><span class="lbl">Дата</span><input type="date" id="pdd" required></label><label class="field"><span class="lbl">Начало</span><input type="time" id="pdst" required></label><label class="field"><span class="lbl">Длительность, мин</span><input type="number" id="pddur" min="5" max="720" step="5" style="width:110px" required></label></div>
  <label class="row"><input type="checkbox" id="pr"> Повторять</label><div class="row rdays" id="prd" hidden><label class="dchip"><input type="checkbox" value="0" checked><span>Пн</span></label><label class="dchip"><input type="checkbox" value="1" checked><span>Вт</span></label><label class="dchip"><input type="checkbox" value="2" checked><span>Ср</span></label><label class="dchip"><input type="checkbox" value="3" checked><span>Чт</span></label><label class="dchip"><input type="checkbox" value="4" checked><span>Пт</span></label><label class="dchip"><input type="checkbox" value="5" checked><span>Сб</span></label><label class="dchip"><input type="checkbox" value="6" checked><span>Вс</span></label><div class="field" style="flex-basis:100%"><span class="lbl">Повторять до</span><label class="dpick" title="Выбрать срок"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="dv"></span><input type="date" class="dpk" id="puntil"></label></div></div>
  <div class="row"><button class="btn" type="submit">Запланировать</button><button class="ghost" type="button" data-act="pcancel">Отмена</button></div>
</form></dialog>
<dialog id="gdlg"><form id="gef">
  <h2>Цель</h2>
  <input type="text" id="get" required maxlength="120" aria-label="Название">
  <select id="ges" aria-label="Сфера"></select>
  <div class="field"><span class="lbl">Срок до</span><label class="dpick" title="Выбрать срок"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="dv"></span><input type="date" class="dpk" id="geend"></label></div>
  <label class="row"><input type="checkbox" id="gedone"> Цель достигнута</label>
  <div class="row"><button class="btn" type="submit">Сохранить</button><button class="ghost" type="button" data-act="gcancel">Отмена</button><button class="ghost" type="button" data-act="gdel" style="margin-left:auto">Удалить</button></div>
</form></dialog>
<dialog id="odlg"><form id="of">
  <h2>Задача просрочена</h2><p class="lbl" id="otl"></p><p class="lbl">Выберите, что с ней сделать.</p>
  <div class="row"><label class="field"><span class="lbl">Дата</span><input type="date" id="od" required></label><label class="field"><span class="lbl">Начало</span><input type="time" id="ot" required></label></div>
  <div class="row"><button class="btn" type="submit">Перепланировать</button><button class="btn alt" type="button" data-act="obag">В мешок</button></div>
  <p class="lbl" id="omsg"></p>
  <div class="row"><button class="ghost" type="button" data-act="odone">✓ Выполнено</button><button class="ghost" type="button" data-act="oedit">Изменить</button><button class="ghost" type="button" data-act="ocancel" style="margin-left:auto">Отмена</button></div>
</form></dialog>
<script>
var SP=[{id:'family',n:'Семья',c:'#D9482B'},{id:'friends',n:'Друзья',c:'#B97A00'},{id:'work',n:'Дело',c:'#2A7BA6'},{id:'body',n:'Тело и ум',c:'#2E9A62'},{id:'love',n:'Отношения',c:'#8A4FD0'}];
var PX=1.2,KEY='planner-v1',WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return {wake:'07:00',bed:'23:00',goals:[],tasks:[],done:{},colors:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));saveErr=false}catch(e){saveErr=true}}
var S=load();S.notes=S.notes||{};S.colors=S.colors||{};S.zones=S.zones||[];if(!S.spheres)S.spheres=SP.map(function(x){return {id:x.id,n:x.n,c:S.colors[x.id]||x.c}});
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){return new Date(s+'T00:00')}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ymd(d)}
function monday(s){return addD(s,-((pd(s).getDay()+6)%7))}
var cdel='',PAL=['#E4572E','#2A7BA6','#2E9A62','#8A4FD0','#B97A00','#D6336C','#0C8599','#5C7CFA'];
var tab='day',view='day',day=ymd(new Date()),curDates=[day],editing=null,drag=null;
function mins(t){var p=t.split(':');return +p[0]*60+ +p[1]}
function hm(m){return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sp(id){var s=S.spheres.filter(function(x){return x.id===id})[0];return s?{id:s.id,n:esc(s.n),c:s.c}:{id:'',n:'Без сферы',c:'#7A8699'}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function setUntil(id,v){var i=document.getElementById(id);i.value=v||'';var dv=i.parentNode.querySelector('.dv');dv.textContent=v?pd(v).toLocaleDateString(LOC[LANG],{day:'numeric',month:'short',year:'numeric'}):''}
function untilV(cb,id){return document.getElementById(cb).checked?document.getElementById(id).value:''}
function occ(t){var a=[];if(!t.repeat||!t.until||!t.date||t.until<t.date)return a;var d=t.date,n=0,wd;while(d<=t.until&&n<800){wd=(pd(d).getDay()+6)%7;if(!t.days||t.days.indexOf(wd)>=0)a.push(d);d=addD(d,1);n++}return a}
function habRow(t){
  var a=occ(t),t0=ymd(new Date()),c=sp(t.sphere).c,dn=a.filter(function(d){return isDone(t,d)}).length,pct=a.length?Math.round(dn/a.length*100):0;
  return '<div class="gr hab"><div class="gh"><span>↻ '+esc(t.title)+'</span><span class="lbl" style="white-space:nowrap">'+dn+' из '+a.length+' · '+pct+'%</span></div><div class="segs'+(a.length>60?' dense':'')+'" role="img" aria-label="Выполнено '+dn+' из '+a.length+'">'+a.map(function(d){var done=isDone(t,d);return '<i'+(done?'':(d<t0?' class="m"':(d===t0?' class="t"':'')))+' title="'+fd(d)+'"'+(done?' style="background:'+c+'"':'')+'></i>'}).join('')+'</div><div class="gh lbl"><span>'+fd(a[0])+'</span><span>'+fd(a[a.length-1])+'</span></div></div>';
}
function subLine(title,st,dn){return '<div class="srow2'+(dn?' done':'')+'"><span class="t">'+esc(title)+'</span><span class="lbl" style="white-space:nowrap">'+st+'</span></div>'}
function subRes(g){
  var rows='',tot=0,dn=0,c=sp(g.sphere).c;
  S.tasks.filter(function(t){return t.goal===g.id&&!t.fromBag}).forEach(function(t){
    if(t.repeat){rows+=occ(t).length?habRow(t):subLine(t.title,repTxt(t),false);return}
    var d=doneT(t.id);tot++;if(d)dn++;
    rows+=subLine(t.title,d?'✓ выполнено':(overdue(t,t.date)?'просрочено':'в календаре: '+fd(t.date)+', '+t.start),d);
  });
  S.bag.filter(function(b){return b.goal===g.id}).forEach(function(b){
    var st=bStat(b),t=b.tid&&find(b.tid),d=st==='done';tot++;if(d)dn++;
    rows+=subLine(b.title,d?'✓ выполнено':(st==='sched'&&t?'в календаре: '+fd(t.date)+', '+t.start:'в мешке'),d);
  });
  if(!rows)return '';
  return '<div class="subs">'+(tot?'<div class="gh lbl"><span>Подзадачи</span><span>'+dn+' из '+tot+'</span></div><div class="bar" role="img" aria-label="Выполнено '+dn+' из '+tot+'"><i style="width:'+(dn/tot*100)+'%;background:'+c+'"></i></div>':'')+rows+'</div>';
}
function getDays(id){var a=[];document.querySelectorAll('#'+id+' input:checked').forEach(function(c){a.push(+c.value)});return a.length?a:[0,1,2,3,4,5,6]}
function setDays(id,arr){document.querySelectorAll('#'+id+' input').forEach(function(c){c.checked=!arr||arr.indexOf(+c.value)>=0})}
function repTxt(t){var a=t.days;return !a||a.length===7?'каждый день':a.slice().sort().map(function(i){return WD[i]}).join(', ')}
function tasksOn(d){var wd=(pd(d).getDay()+6)%7;return S.tasks.filter(function(t){return t.repeat?(d>=t.date&&(!t.until||d<=t.until)&&(!t.days||t.days.indexOf(wd)>=0)):t.date===d}).sort(function(a,b){return mins(a.start)-mins(b.start)})}
function isDone(t,d){return !!S.done[t.id+'|'+d]}
function find(id){return S.tasks.filter(function(t){return t.id===id})[0]}
function dates(){return view==='day'?[day]:[0,1,2,3,4,5,6].map(function(i){return addD(monday(day),i)})}
function step(dir){if(view==='day')day=addD(day,dir);else if(view==='week')day=addD(day,7*dir);else{var d=pd(day);d.setDate(1);d.setMonth(d.getMonth()+dir);day=ymd(d)}drawMain()}
function label(){
  if(view==='day')return pd(day).toLocaleDateString(LOC[LANG],{weekday:'long',day:'numeric',month:'long'});
  if(view==='month')return pd(day).toLocaleDateString(LOC[LANG],{month:'long',year:'numeric'});
  var d=dates();return pd(d[0]).toLocaleDateString(LOC[LANG],{day:'numeric',month:'short'})+' – '+pd(d[6]).toLocaleDateString(LOC[LANG],{day:'numeric',month:'short',year:'numeric'});
}
function render(){
  var mcb=document.getElementById('mic');if(mcb)mcb.hidden=tab!=='day';
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===tab)});
  document.querySelector('.gear').setAttribute('aria-pressed',tab==='set');
  var v=document.getElementById('view');
  if(tab==='day'){
    var opts=S.spheres.map(function(s){return '<option value="'+s.id+'">'+esc(s.n)+'</option>'}).join('');
    v.innerHTML=
    '<div class="card"><div class="row nav"><button class="ghost" data-act="prev" aria-label="Назад">‹</button><div class="date" id="dl"></div><button class="ghost" data-act="next" aria-label="Вперёд">›</button></div>'+
    '<p class="qd" id="qd"></p>'+
    '<div class="row"><div class="seg" style="flex:1;min-width:220px">'+[['day','День'],['week','Неделя'],['month','Месяц']].map(function(x){return '<button data-act="view" data-v="'+x[0]+'" aria-pressed="'+(view===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'+
    '</div><div class="row" style="justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:nowrap"><p class="prog" id="pg" style="margin:0"></p><span id="eff"></span></div>'+
    '</div>'+
    '<div class="card" id="life"></div>'+
    '<details class="card"><summary>Новая задача</summary><form id="tf" style="margin-top:8px"><div class="row"><input type="text" id="tt" placeholder="Что нужно сделать" required maxlength="120" aria-label="Название задачи"><select id="ts" aria-label="Сфера">'+opts+'</select></div>'+

function stSpread(){

function stValid(){

var QQ=[[0,"Я знаю, что ничего не знаю.","I know that I know nothing."],[0,"Непознанная жизнь не стоит того, чтобы её прожить.","The unexamined life is not worth living."],[0,"Кто хочет сдвинуть мир, пусть сначала сдвинет самого себя.","He who would move the world must first move himself."],[1,"Корни образования горьки, но плоды его сладки.","The roots of education are bitter, but the fruit is sweet."],[1,"Человек по природе стремится к знанию.","All men by nature desire to know."],[2,"Начало — самая важная часть любого дела.","The beginning is the most important part of the work."],[2,"Первая и лучшая победа — победить самого себя.","The first and best victory is to conquer self."],[3,"Неважно, как медленно ты идёшь, лишь бы не останавливаться.","It does not matter how slowly you go as long as you do not stop."],[3,"Учиться и время от времени повторять выученное — разве это не радость?","To learn and at due times practise what one has learned — is that not a pleasure?"],[3,"Благородный муж требователен к себе, ничтожный — к другим.","The superior man is hard on himself; the inferior man is hard on others."],[4,"Путь в тысячу ли начинается с первого шага.","A journey of a thousand miles begins with a single step."],[4,"Знать других — мудрость, знать себя — просветление.","Knowing others is intelligence; knowing yourself is true wisdom."],[4,"Кто побеждает других — силён; кто побеждает себя — могуществен.","Mastering others is strength. Mastering yourself is true power."],[4,"Великое рождается из малого.","The great is born from the small."],[5,"Пока мы откладываем, жизнь проходит.","While we are postponing, life speeds by."],[5,"Не потому мы не решаемся, что трудно; трудно потому, что мы не решаемся.","It is not because things are difficult that we do not dare; it is because we do not dare that they are difficult."],[5,"Тому, кто не знает, к какой гавани плыть, никакой ветер не будет попутным.","If a man does not know to which port he is sailing, no wind is favorable."],[5,"Мы страдаем чаще в воображении, чем в действительности.","We suffer more often in imagination than in reality."],[5,"Жизнь не коротка — мы сами тратим её слишком расточительно.","It is not that we have a short time to live, but that we waste a lot of it."],[6,"То, что стоит на пути, само становится путём.","What stands in the way becomes the way."],[6,"Не считай невозможным то, что трудно для тебя.","Do not think a thing impossible for you because it is hard."],[6,"Лучший способ отомстить — не уподобляться обидчику.","The best revenge is not to be like your enemy."],[6,"Совершенство характера — прожить каждый день как последний, без суеты и притворства.","The perfection of character: to live each day as if it were your last, without frenzy, without pretense."],[6,"Человек живёт лишь в настоящем — в этом мимолётном мгновении.","Remember that man lives only in the present, in this fleeting instant."],[7,"Людей тревожат не вещи, а их мнения о вещах.","Men are disturbed not by things, but by the views which they take of them."],[7,"Сначала реши, кем хочешь быть, а затем делай то, что нужно.","First say to yourself what you would be; and then do what you have to do."],[7,"Богатство не в том, чтобы многим владеть, а в том, чтобы мало желать.","Wealth consists not in having great possessions, but in having few wants."],[7,"Нет свободного человека, который не господин самому себе.","No man is free who is not master of himself."],[8,"Пока есть жизнь — есть надежда.","While there is life, there is hope."],[8,"Благодарность — величайшая из добродетелей и мать всех остальных.","Gratitude is not only the greatest of virtues, but the parent of all the others."],[8,"Если у тебя есть сад и библиотека, у тебя есть всё необходимое.","If you have a garden and a library, you have everything you need."],[9,"Нельзя дважды войти в одну и ту же реку.","No man ever steps in the same river twice."],[10,"Железо ржавеет без употребления, вода гниёт в покое — так бездействие разрушает ум.","Iron rusts from disuse; stagnant water loses its purity; even so does inaction sap the mind."],[10,"Учение никогда не истощает разум.","Learning never exhausts the mind."],[10,"Кто мало думает, тот много ошибается.","He who thinks little errs much."],[10,"Как хорошо прожитый день дарит спокойный сон, так хорошо прожитая жизнь — спокойную смерть.","As a well-spent day brings happy sleep, so a life well used brings happy death."],[11,"Мало знать — нужно применять; мало хотеть — нужно делать.","Knowing is not enough; we must apply. Willing is not enough; we must do."],[11,"Пока человек стремится, он заблуждается — и движется вперёд.","Man errs as long as he strives."],[12,"Все думают изменить мир, но никто не думает изменить себя.","Everyone thinks of changing the world, but no one thinks of changing himself."],[12,"Самое важное время — сейчас, самый нужный человек — тот, кто рядом, самое важное дело — сделать ему добро.","The most important time is now, the most important person is the one beside you, the most important thing is to do them good."],[12,"Нет величия там, где нет простоты, добра и правды.","There is no greatness where there is not simplicity, goodness and truth."],[12,"Самые сильные воины — терпение и время.","The two most powerful warriors are patience and time."],[13,"Краткость — сестра таланта.","Brevity is the sister of talent."],[13,"Человек есть то, во что он верит.","Man is what he believes."],[14,"Тайна бытия не в том, чтобы просто жить, а в том, для чего жить.","The mystery of human existence lies not in just staying alive, but in finding something to live for."],[14,"Надо любить жизнь больше, чем смысл её.","Love life more than the meaning of it."],[14,"Человек — тайна. Её надо разгадывать, и если будешь разгадывать всю жизнь, не говори, что потерял время.","Man is a mystery. If you spend your whole life trying to solve it, don't say that you wasted time."],[15,"Привычка свыше нам дана: замена счастию она.","Habit is given to us from above: it is a substitute for happiness."],[16,"Жизнь подобна езде на велосипеде: чтобы сохранить равновесие, нужно двигаться.","Life is like riding a bicycle. To keep your balance, you must keep moving."],[16,"Воображение важнее знания.","Imagination is more important than knowledge."],[16,"Главное — не переставать задавать вопросы.","The important thing is not to stop questioning."],[16,"Дело не в том, что я так умён, — я просто дольше остаюсь с задачей.","It's not that I'm so smart; I just stay with problems longer."],[17,"Если я видел дальше других, то потому, что стоял на плечах гигантов.","If I have seen further, it is by standing on the shoulders of giants."],[17,"Я кажусь себе мальчиком, играющим на берегу моря, тогда как океан истины лежит передо мной неизведанным.","I seem to have been only like a boy playing on the sea-shore, while the great ocean of truth lay all undiscovered before me."],[18,"Тот, кто смеет тратить впустую час времени, не постиг ценности жизни.","A man who dares to waste one hour of time has not discovered the value of life."],[19,"Гений — один процент вдохновения и девяносто девять процентов пота.","Genius is one percent inspiration and ninety-nine percent perspiration."],[19,"Я не терпел неудач. Я просто нашёл 10 000 способов, которые не работают.","I have not failed. I've just found 10,000 ways that won't work."],[19,"Большинство упускает возможность, потому что она одета в рабочий комбинезон и похожа на труд.","Opportunity is missed by most people because it is dressed in overalls and looks like work."],[20,"Настоящее принадлежит им, но будущее, ради которого я работал, — моё.","The present is theirs; the future, for which I really worked, is mine."],[21,"Ты можешь откладывать, но время — нет.","You may delay, but time will not."],[21,"Потерянное время не вернуть.","Lost time is never found again."],[21,"Вложения в знания приносят лучший доход.","An investment in knowledge pays the best interest."],[21,"Хочешь, чтобы дело было сделано, gle candle, and the life of the candle will not be shortened."],[50,"Лучше одно слово, приносящее покой, чем тысяча пустых слов.","Better than a thousand hollow words is one word that brings peace."],[51,"То, что ты ищешь, ищет тебя.","What you seek is seeking you."],[51,"Рана — это место, через которое в тебя входит свет.","The wound is the place where the light enters you."],[52,"Кто смотрит вовне — грезит, кто смотрит внутрь — пробуждается.","Who looks outside, dreams; who looks inside, awakes."],[52,"Встреча двух личностей — как контакт двух веществ: если есть реакция, меняются оба.","The meeting of two personalities is like the contact of two chemical substances: if there is any reaction, both are transformed."],[53,"Когда мы не в силах изменить ситуацию, мы вынуждены изменить себя.","When we are no longer able to change a situation, we are challenged to change ourselves."],[53,"У человека можно отнять всё, кроме последней свободы — выбирать своё отношение к обстоятельствам.","Everything can be taken from a man but the last of the human freedoms — to choose one's attitude in any given circumstances."],[53,"Жизнь невыносима не из-за обстоятельств, а из-за отсутствия смысла и цели.","Life is never made unbearable by circumstances, but only by lack of meaning and purpose."],[54,"Беда в том, что глупцы самоуверенны, а умные полны сомнений.","The stupid are cocksure while the intelligent are full of doubt."],[54,"Секрет счастья — чтобы твои интересы были как можно шире.","The secret of happiness is to let your interests be as wide as possible."],[55,"Из всего, что мудрость даёт для счастья жизни, величайшее — дружба.","Of all that wisdom provides for a happy life, by far the greatest is friendship."],[57,"Лови день, как можно меньше доверяя грядущему.","Seize the day, trusting as little as possible in tomorrow."],[57,"Осмелься знать!","Dare to know!"],[58,"Побеждающий воин сначала побеждает, а потом вступает в бой.","Victorious warriors win first and then go to war. oblem is how to remain an artist once we grow up."],[70,"Я всё ещё учусь.","I am still learning."],[71,"Великое делается не силой, а совокупностью малых дел.","Great things are done by a series of small things brought together."],[71,"Если внутренний голос говорит «ты не можешь рисовать» — рисуй, и голос замолчит.","If you hear a voice within you say “you cannot paint,” then by all means paint, and that voice will be silenced."],[72,"Жизнь — трагедия вблизи и комедия издалека.","Life is a tragedy when seen in close-up, but a comedy in long-shot."],[73,"Нельзя ждать вдохновения. За ним надо охотиться с дубинкой.","You can't wait for inspiration. You have to go after it with a club."],[74,"Книга должна быть топором, разбивающим замёрзшее море внутри нас.","A book must be the axe for the frozen sea within us."],[75,"Посреди зимы я понял, что внутри меня — непобедимое лето.","In the midst of winter, I found there was, within me, an invincible summer."],[76,"Видеть то, что у тебя перед носом, — постоянная борьба.","To see what is in front of one's nose needs a constant struggle."],[77,"Никто не бесполезен в этом мире, кто облегчает ношу другому.","No one is useless in this world who lightens the burden of it for anyone else."],[78,"Величайшее на свете — уметь принадлежать самому себе.","The greatest thing in the world is to know how to belong to oneself."],[79,"Здоровье — не всё, но без здоровья всё — ничто.","Health is not everything, but without health everything is nothing."],[80,"Любите книгу — источник знания.","Love books — the source of knowledge."],[81,"Науки юношей питают, отраду старым подают.","Sciences nourish the young and delight the old."],[82,"Тяжело в учении — легко в бою.","Hard in training, easy in battle."],[83,"Поехали!","Let's go!"],[84,"Кто много читает и много ходит, тот много видит и много знает.","He who reads much and walks much sees much and knows much."],[85,"Живи вопросами сейчас.","Live the questions now."],[86,"Те, кто преуспевает, ищут нужные обстоятельства, а не найдя — создают их.","The people who get on in this world are the people who get up and look for the circumstances they want, and if they can't find them, make them."],[87,"Я выбрал ту дорогу, что реже хожена, — и это решило всё.","I took the one less traveled by, and that has made all the difference."],[88,"Как чудесно, что никому не нужно ждать ни минуты, чтобы начать улучшать мир.","How wonderful it is that nobody need wait a single moment before starting to improve the world."],[89,"Великое совершается не силой, а упорством.","Great works are performed not by strength but by perseverance."],[91,"Лучшее применение жизни — потратить её на то, что переживёт её.","The best use of life is to spend it for something that will outlast it."],[91,"Действие следует за чувством, но на деле они идут рука об руку.","Action seems to follow feeling, but really action and feeling go together."],[92,"Кем человек может быть, тем он и должен быть.","What a man can be, he must be."],[93,"Начинай, держа в уме конец.","Begin with the end in mind."],[93,"Главное — не расставить приоритеты в расписании, а вписать в расписание свои приоритеты.","The key is not to prioritize what's on your schedule, but to schedule your priorities."],[94,"Планы бесполезны, но планирование незаменимо.","Plans are worthless, but planning is everything."],[94,"Важное редко бывает срочным, а срочное — редко важным.","What is important is seldom urgent, and what is urgent is seldom important."],[95,"Капля точит камень не силой, а частым падением.","A drop hollows out a stone not by force but by falling often."],[96,"Упорный труд побеждает всё.","Persistent toil conquers all."],[97,"Не всякий, кто блуждает, потерян.","Not all those who wander are lost."],[98,"Хороший план, исполненный сейчас, лучше идеального плана на следующей неделе.","A good plan executed now is better than a perfect plan next week."],[99,"Суди о дне не по собранному урожаю, а по посеянным семенам.","Don't judge each day by the harvest you reap but by the seeds that you plant."],[100,"Я промахивался больше девяти тысяч раз — и именно поэтому добиваюсь успеха.","I've missed more than 9,000 shots in my career. That is why I succeed."],[101,"Ты упускаешь сто процентов бросков, которые не сделал.","You miss 100% of the shots you don't take."],[102,"Дисциплина — мост между целями и достижениями.","Discipline is the bridge between goals and accomplishment."],[103,"Приучите себя к строгой последовательности в накоплении знаний.","Get used to strict consistency in accumulating knowledge."],[104,"Земля — колыбель разума, но нельзя вечно жить в колыбели.","Earth is the cradle of humanity, but one cannot live in a cradle forever."],[105,"Я был вынужден трудиться; кто будет так же усерден, достигнет того же.","I was obliged to be industrious. Whoever is equally industrious will succeed equally well."],[106,"Вдохновение — гостья, которая не любит посещать ленивых.","Inspiration is a guest that does not willingly visit the lazy."],[107,"Рукописи не горят.","Manuscripts don't burn."],[108,"Всё, что человек способен представить, другие смогут осуществить.","Anything one man can imagine, other men can make real."],[109,"Мы — способ, которым Космос познаёт самого себя.","We are a way for the cosmos to know itself."],[110,"Покоряем мы не гору, а самих себя.","It is not the mountain we conquer, but ourselves."],[111,"Наше дело — не всматриваться в смутную даль, а делать то, что лежит рядом.","Our main business is not to see what lies dimly at a distance, but to do what lies clearly at hand."],[112,"Вставай, пробудись и не останавливайся, пока не достигнешь цели.","Arise, awake, and stop not till the goal is reached."],[113,"Вера — птица, что чувствует свет и поёт, когда заря ещё тёмная.","Faith is the bird that feels the light and sings when the dawn is still dark."]];

          else fail++;
        }

        if(e&&e.code==='tool_error'){fail++;continue}
        throw e;
      }
      done++;save();
    }
    if(total>ops.length)GC.err='Отправлена часть изменений, остальное — при следующей синхронизации';
    else if(fail)GC.err='Часть задач не удалось отправить в Google';

    GC.sig=gcSig();
  }catch(e){
    if(e&&e.code==='tool_error'&&/exhaust|quota|rate/i.test(String(e.message||'')))GC.pause=Date.now()+45*60000;
    GC.err=gcErrT(e);
  }
  GC.busy=false;GC.prog='';
  gcUI();

var SNAPK='planner-snap-';
function snapMain(){var o={};Object.keys(S).forEach(function(k){if(!SKEEP[k])o[k]=S[k]});return JSON.stringify(o)}
function snapList(){var l=[],i,k;try{for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(k&&k.indexOf(SNAPK)===0)l.push(k)}}catch(e){}return l.sort().reverse()}
function snapN(str){try{return (JSON.parse(str).tasks||[]).length}catch(e){return 0}}
function snapTake(force){
  try{
    var l=snapList(),now=Date.now(),str=snapMain(),last=l[0]?localStorage.getItem(l[0]):null;
    if(!force&&l[0]&&now-(+l[0].slice(SNAPK.length))<1800000)return;
    if(last===str)return;
    if(!force&&last&&snapN(str)<snapN(last)*0.7)return;
    localStorage.setItem(SNAPK+now,str);
    snapList().slice(12).forEach(function(k){localStorage.removeItem(k)});
  }catch(e){}
}
function snapCard(){
  var rows=[],bk=null;
  try{bk=localStorage.getItem('planner-backup-main')}catch(e){}
  snapList().forEach(function(k){
    var str=localStorage.getItem(k),d=new Date(+k.slice(SNAPK.length));
    rows.push('<div class="row" style="justify-content:space-between;align-items:center;margin-top:6px"><span class="lbl">'+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+' '+hm(d.getHours()*60+d.getMinutes())+' · задач: '+snapN(str)+'</span><button class="btn alt sm" type="button" data-sn="'+k+'">Восстановить</button></div>');
  });
  if(bk)rows.push('<div class="row" style="justify-content:space-between;align-items:center;margin-top:6px"><span class="lbl">Копия перед обновлением из облака · задач: '+snapN(bk)+'</span><button class="btn alt sm" type="button" data-sn="planner-backup-main">Восстановить</button></div>');

  return '<div class="card"><h2 style="font-size:16px;margin-bottom:4px">Резервные копии</h2><p class="lbl" style="margin:0 0 4px">Приложение само сохраняет копии ваших задач на этом устройстве. Если что-то пропало, выберите копию.</p>'+(rows.join('')||'<p class="lbl">Копий пока нет</p>')+'</div>';
}
